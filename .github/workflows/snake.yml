name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * 0"  # Every Sunday
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate contribution snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: EaruvaTeja
          # Warm contribution palette (brown -> orange -> golden -> yellow) with a teal snake.
          # color_dots order: empty (GitHub default gray), low, medium, high, very high.
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%232dd4bf&color_dots=%23ebedf0,%237c4d2a,%23c97a2b,%23f2a93b,%23ffd95a&color_dot_border=%230d1117
            dist/github-contribution-grid-snake-dark.svg?color_snake=%232dd4bf&color_dots=%23161b22,%237c4d2a,%23c97a2b,%23f2a93b,%23ffd95a&color_dot_border=%230d1117

      - name: Push output to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
