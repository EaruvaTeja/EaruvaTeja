name: Generate Profile Metrics

on:
  schedule:
    - cron: "0 */12 * * *"   # refresh twice a day
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  # Core stats + lines of code (top languages removed per request)
  classic-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics.classic.svg
          theme: github-dark
          config_timezone: Asia/Kolkata
          base: header, activity, community, repositories, metadata
          plugin_lines: yes
