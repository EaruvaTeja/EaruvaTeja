name: Generate Profile Metrics

on:
  schedule:
    - cron: "0 */12 * * *"   # refresh twice a day
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  # ---- 1) Core stats + top languages + repositories (replaces broken stats/top-langs cards) ----
  classic-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics.classic.svg
          theme: github-dark
          config_timezone: Asia/Kolkata
          base: header, activity, community, repositories, metadata
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_recent_categories: markup, programming
          plugin_languages_indepth: yes
          plugin_lines: yes

  # ---- 2) Full-year isometric contribution calendar (the requested feature) ----
  isocalendar-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics.isocalendar.svg
          theme: github-dark
          config_timezone: Asia/Kolkata
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

  # ---- 3) Achievements (replaces broken trophies) ----
  achievements-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics.achievements.svg
          theme: github-dark
          config_timezone: Asia/Kolkata
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
